            { id: 10, category: "J vs P · 계획 수립", question: "시험 한 달 전, 나의 공부 계획 수립 방식은?", optionA: { text: "A. 주별, 일별로 어떤 과목을 몇 페이지까지 풀지 타임테이블을 짠다.", type: "J" }, optionB: { text: "B. 큰 범위만 염두에 두고, 그날그날 끌리는 과목 위주로 집중한다.", type: "P" } },
            { id: 11, category: "J vs P · 공부 공간", question: "지금 내 책상 위나 공부 공간의 정돈 상태는?", optionA: { text: "A. 과목별 책과 필기구가 제자리에 정돈되어 있어 바로 시작할 수 있다.", type: "J" }, optionB: { text: "B. 여러 과목의 책이 펼쳐져 있지만 나만의 규칙 속에서 찾아 쓴다.", type: "P" } },
            { id: 12, category: "J vs P · 벼락치기", question: "갑작스럽게 내일까지 제출해야 하는 과제가 생겼을 때 나의 태도는?", optionA: { text: "A. 스트레스를 받지만 즉시 우선순위를 조율해 체계적으로 끝낸다.", type: "J" }, optionB: { text: "B. \"벼락치기의 힘을 보여주지!\" 긴장감 속에 초인적 몰입력이 발휘된다.", type: "P" } },
        ];

        const canvas = document.getElementById('mbtiCanvas');
        const ctx = canvas.getContext('2d');

        let width = 0;
        let height = 0;
        let dpr = window.devicePixelRatio || 1;

        // App States: 'INTRO', 'QUIZ', 'ANALYZING', 'RESULT'
        let state = 'INTRO';
        let currentQIndex = 0;
        let userAnswers = [];
        let analyzingProgress = 0;
        let toastMessage = '';
        let toastTimer = null;

        let hoverId = null;
        let clickTargets = [];

        // Scroll state for result page
        let scrollY = 0;
        let targetScrollY = 0;
        let maxScrollY = 1200;
        let isDragging = false;
        let startY = 0;
        let dragScrollStart = 0;

        // Animated particles in background
        const particles = Array.from({ length: 30 }, () => ({
            x: Math.random(),
            y: Math.random(),
            radius: Math.random() * 3 + 1,
            vx: (Math.random() - 0.5) * 0.0005,
            vy: (Math.random() - 0.5) * 0.0005,
            alpha: Math.random() * 0.5 + 0.2
        }));

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            dpr = Math.min(window.devicePixelRatio || 1, 2);

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Helper: Draw rounded rectangle
        function drawRoundedRect(ctx, x, y, w, h, r, fillColor, strokeColor, lineWidth = 1) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();

            if (fillColor) {
                ctx.fillStyle = fillColor;
                ctx.fill();
            }
            if (strokeColor) {
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
            }
        }

        // Helper: Text wrap renderer
        function drawTextWithWrap(ctx, text, x, y, maxWidth, lineHeight, font, color, align = 'left') {
            ctx.font = font;
            ctx.fillStyle = color;
            ctx.textAlign = align;

            const chars = text.split('');
            let line = '';
            let currentY = y;

            for (let n = 0; n < chars.length; n++) {
                let testLine = line + chars[n];
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;

                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = chars[n];
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
            return currentY + lineHeight - y;
        }

        function showToast(msg) {
            toastMessage = msg;
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastMessage = '';
            }, 3000);
        }

        function renderBackground() {
            const bgGrad = ctx.createLinearGradient(0, 0, width, height);
            bgGrad.addColorStop(0, '#0F172A');
            bgGrad.addColorStop(0.5, '#1E1B4B');
            bgGrad.addColorStop(1, '#0F172A');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = 1;
                if (p.x > 1) p.x = 0;
                if (p.y < 0) p.y = 1;
                if (p.y > 1) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x * width, p.y * height, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(139, 92, 246, ${p.alpha})`;
                ctx.fill();
            });
        }

        function calculateMBTIResult() {
            let e = 0, i = 0, s = 0, n = 0, t = 0, f = 0, j = 0, p = 0;

            userAnswers.forEach(ans => {
                if (ans === 'E') e++;
                if (ans === 'I') i++;
                if (ans === 'S') s++;
                if (ans === 'N') n++;
                if (ans === 'T') t++;
                if (ans === 'F') f++;
                if (ans === 'J') j++;
                if (ans === 'P') p++;
            });

            const mbtiType = `${e >= i ? 'E' : 'I'}${s >= n ? 'S' : 'N'}${t >= f ? 'T' : 'F'}${j >= p ? 'J' : 'P'}`;

            const ePct = Math.round((e / 3) * 100);
            const iPct = 100 - ePct;
            const sPct = Math.round((s / 3) * 100);
            const nPct = 100 - sPct;
            const tPct = Math.round((t / 3) * 100);
            const fPct = 100 - tPct;
            const jPct = Math.round((j / 3) * 100);
            const pPct = 100 - jPct;

            return {
                mbtiType,
                ratios: { ePct, iPct, sPct, nPct, tPct, fPct, jPct, pPct }
            };
        }

        function renderIntroScreen() {
            clickTargets = [];

            const padding = Math.min(width * 0.08, 30);
            const cardW = width - padding * 2;
            const cardX = padding;
            const cardY = height * 0.08;
            const cardH = height * 0.84;

            drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 24, 'rgba(30, 41, 59, 0.85)', 'rgba(99, 102, 241, 0.3)', 2);

            drawRoundedRect(ctx, width / 2 - 80, cardY + 30, 160, 28, 14, 'rgba(99, 102, 241, 0.25)', '#818CF8', 1);
            ctx.font = 'bold 12px "Noto Sans KR"';
            ctx.fillStyle = '#C7D2FE';
            ctx.textAlign = 'center';
            ctx.fillText('✨ 학생 맞춤 학습 가이드', width / 2, cardY + 48);

            const iconY = cardY + 110;
            ctx.beginPath();
            ctx.arc(width / 2, iconY, 40, 0, Math.PI * 2);
            const iconGrad = ctx.createLinearGradient(width / 2 - 40, iconY - 40, width / 2 + 40, iconY + 40);
            iconGrad.addColorStop(0, '#6366F1');
            iconGrad.addColorStop(1, '#A855F7');
            ctx.fillStyle = iconGrad;
            ctx.fill();

            ctx.font = '36px "Noto Sans KR"';
            ctx.fillText('🎓', width / 2, iconY + 12);

            ctx.font = 'bold 22px "Noto Sans KR"';
            ctx.fillStyle = '#F8FAFC';
            ctx.fillText('12문항 MBTI & 맞춤 학습법', width / 2, cardY + 185);

            const descY = cardY + 220;
            drawTextWithWrap(ctx, '단 12문항으로 나의 MBTI 성격 유형을 진단하고, 나에게 꼭 맞는 학습 강점, 추천 공부법, 최적 환경을 찾아보세요.', width / 2, descY, cardW - 40, 22, '400 13px "Noto Sans KR"', '#94A3B8', 'center');

            const gridY = descY + 65;
            const gridW = cardW - 40;
            const gridX = cardX + 20;
            drawRoundedRect(ctx, gridX, gridY, gridW, 140, 16, 'rgba(15, 23, 42, 0.6)', 'rgba(51, 65, 85, 0.5)', 1);

            const featureItems = [
                { icon: '1', title: '12개 핵심 문항 (3분)' },
                { icon: '2', title: '16가지 맞춤 학습 분석' },
                { icon: '3', title: '슬럼프 극복 팁 제공' },
                { icon: '4', title: '최적 학습 장소 추천' }
            ];

            featureItems.forEach((item, idx) => {
                const col = idx % 2;
                const row = Math.floor(idx / 2);
                const fx = gridX + 15 + col * (gridW / 2);
                const fy = gridY + 25 + row * 60;

                drawRoundedRect(ctx, fx, fy, 22, 22, 11, idx % 2 === 0 ? '#6366F1' : '#EC4899');
                ctx.font = 'bold 11px "Noto Sans KR"';
                ctx.fillStyle = '#FFFFFF';
                ctx.textAlign = 'center';
                ctx.fillText(item.icon, fx + 11, fy + 15);

                ctx.font = '500 12px "Noto Sans KR"';
                ctx.fillStyle = '#E2E8F0';
                ctx.textAlign = 'left';
                ctx.fillText(item.title, fx + 30, fy + 15);
            });

            const btnW = cardW - 40;
            const btnH = 54;
            const btnX = cardX + 20;
            const btnY = cardY + cardH - 80;

            const isHovered = hoverId === 'btn_start';
            const btnBg = isHovered ? '#4F46E5' : '#6366F1';

            drawRoundedRect(ctx, btnX, btnY, btnW, btnH, 16, btnBg, '#818CF8', isHovered ? 2 : 1);

            ctx.font = 'bold 16px "Noto Sans KR"';
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.fillText('테스트 시작하기 🚀', btnX + btnW / 2, btnY + 33);

            clickTargets.push({
                id: 'btn_start',
                x: btnX,
                y: btnY,
                w: btnW,
                h: btnH,
                onClick: () => {
                    userAnswers = [];
                    currentQIndex = 0;
                    state = 'QUIZ';
                }
            });
        }

        function renderQuizScreen() {
            clickTargets = [];

            const padding = Math.min(width * 0.08, 30);
            const cardW = width - padding * 2;
            const cardX = padding;
            const cardY = height * 0.08;
            const cardH = height * 0.84;

            const q = QUESTIONS[currentQIndex];

            drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 24, 'rgba(30, 41, 59, 0.85)', 'rgba(99, 102, 241, 0.3)', 2);

            ctx.font = 'bold 12px "Noto Sans KR"';
            ctx.fillStyle = '#818CF8';
            ctx.textAlign = 'left';
            ctx.fillText(`질문 ${currentQIndex + 1} / ${QUESTIONS.length}`, cardX + 24, cardY + 36);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#94A3B8';
            ctx.fillText(`${Math.round(((currentQIndex + 1) / QUESTIONS.length) * 100)}%`, cardX + cardW - 24, cardY + 36);

            const progressY = cardY + 48;
            const progressW = cardW - 48;
            drawRoundedRect(ctx, cardX + 24, progressY, progressW, 8, 4, '#334155');

            const fillW = progressW * ((currentQIndex + 1) / QUESTIONS.length);
            drawRoundedRect(ctx, cardX + 24, progressY, fillW, 8, 4, '#6366F1');

            const catY = cardY + 75;
            drawRoundedRect(ctx, cardX + 24, catY, 180, 26, 13, 'rgba(99, 102, 241, 0.2)', '#818CF8', 1);
            ctx.font = 'bold 11px "Noto Sans KR"';
            ctx.fillStyle = '#A5B4FC';
            ctx.textAlign = 'center';
            ctx.fillText(q.category, cardX + 114, catY + 17);

            const qY = catY + 50;
            drawTextWithWrap(ctx, q.question, cardX + 24, qY, cardW - 48, 28, 'bold 18px "Noto Sans KR"', '#F8FAFC', 'left');

            const optA_Y = cardY + 190;
            const optH = 90;
            const isHoverA = hoverId === 'opt_A';
            const bgA = userAnswers[currentQIndex] === q.optionA.type ? 'rgba(99, 102, 241, 0.35)' : (isHoverA ? 'rgba(51, 65, 85, 0.8)' : 'rgba(30, 41, 59, 0.6)');
            const borderA = userAnswers[currentQIndex] === q.optionA.type ? '#818CF8' : (isHoverA ? '#A5B4FC' : '#475569');

            drawRoundedRect(ctx, cardX + 24, optA_Y, cardW - 48, optH, 16, bgA, borderA, 1.5);
            drawTextWithWrap(ctx, q.optionA.text, cardX + 44, optA_Y + 28, cardW - 88, 22, '500 14px "Noto Sans KR"', '#E2E8F0', 'left');

            clickTargets.push({
                id: 'opt_A',
                x: cardX + 24,
                y: optA_Y,
                w: cardW - 48,
                h: optH,
                onClick: () => handleSelectOption(q.optionA.type)
            });

            const optB_Y = optA_Y + optH + 16;
            const isHoverB = hoverId === 'opt_B';
            const bgB = userAnswers[currentQIndex] === q.optionB.type ? 'rgba(168, 85, 247, 0.35)' : (isHoverB ? 'rgba(51, 65, 85, 0.8)' : 'rgba(30, 41, 59, 0.6)');
            const borderB = userAnswers[currentQIndex] === q.optionB.type ? '#C084FC' : (isHoverB ? '#E9D5FF' : '#475569');

            drawRoundedRect(ctx, cardX + 24, optB_Y, cardW - 48, optH, 16, bgB, borderB, 1.5);
            drawTextWithWrap(ctx, q.optionB.text, cardX + 44, optB_Y + 28, cardW - 88, 22, '500 14px "Noto Sans KR"', '#E2E8F0', 'left');

            clickTargets.push({
                id: 'opt_B',
                x: cardX + 24,
                y: optB_Y,
                w: cardW - 48,
                h: optH,
                onClick: () => handleSelectOption(q.optionB.type)
            });

            if (currentQIndex > 0) {
                const backY = cardY + cardH - 50;
                const isBackHover = hoverId === 'btn_back';
                ctx.font = 'bold 13px "Noto Sans KR"';
                ctx.fillStyle = isBackHover ? '#F8FAFC' : '#94A3B8';
                ctx.textAlign = 'left';
                ctx.fillText('← 이전 질문으로', cardX + 24, backY);

                clickTargets.push({
                    id: 'btn_back',
                    x: cardX + 20,
                    y: backY - 20,
                    w: 120,
                    h: 30,
                    onClick: () => {
                        currentQIndex--;
                    }
                });
            }
        }

        function handleSelectOption(type) {
            userAnswers[currentQIndex] = type;
            if (currentQIndex < QUESTIONS.length - 1) {
                currentQIndex++;
            } else {
                state = 'ANALYZING';
                analyzingProgress = 0;
            }
        }

        function renderAnalyzingScreen() {
            analyzingProgress = Math.min(100, analyzingProgress + 1.8);

            const padding = Math.min(width * 0.08, 30);
            const cardW = width - padding * 2;
            const cardX = padding;
            const cardY = height * 0.2;
            const cardH = height * 0.6;

            drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 24, 'rgba(30, 41, 59, 0.85)', 'rgba(99, 102, 241, 0.3)', 2);

            const spinnerX = width / 2;
            const spinnerY = cardY + cardH * 0.35;
            const radius = 36;
            const angle = (Date.now() / 300) % (Math.PI * 2);

            ctx.beginPath();
            ctx.arc(spinnerX, spinnerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.2)';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(spinnerX, spinnerY, radius, angle, angle + 1.5);
            ctx.strokeStyle = '#818CF8';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.font = '28px "Noto Sans KR"';
            ctx.textAlign = 'center';
            ctx.fillText('🧠', spinnerX, spinnerY + 10);

            ctx.font = 'bold 18px "Noto Sans KR"';
            ctx.fillStyle = '#F8FAFC';
            ctx.fillText('나만의 학습 유형 분석 중...', width / 2, spinnerY + 70);

            ctx.font = '13px "Noto Sans KR"';
            ctx.fillStyle = '#94A3B8';
            ctx.fillText('12가지 응답을 바탕으로 공부 전략을 생성합니다.', width / 2, spinnerY + 95);

            const barW = cardW - 80;
            const barX = cardX + 40;
            const barY = spinnerY + 125;
            drawRoundedRect(ctx, barX, barY, barW, 8, 4, '#334155');
            drawRoundedRect(ctx, barX, barY, (barW * analyzingProgress) / 100, 8, 4, '#6366F1');

            if (analyzingProgress >= 100) {
                state = 'RESULT';
                scrollY = 0;
                targetScrollY = 0;
            }
        }

        function renderResultScreen() {
            clickTargets = [];

            scrollY += (targetScrollY - scrollY) * 0.15;

            const result = calculateMBTIResult();
            const profile = MBTI_LEARNING_DATA[result.mbtiType];

            const padding = Math.min(width * 0.08, 30);
            const cardW = width - padding * 2;
            const cardX = padding;

            ctx.save();
            ctx.translate(0, -scrollY);

            let currentY = 50;
            const startCardY = currentY;

            const pillW = 100;
            drawRoundedRect(ctx, width / 2 - pillW / 2, currentY, pillW, 32, 16, 'rgba(99, 102, 241, 0.25)', '#818CF8', 1.5);
            ctx.font = 'extrabold 15px "Noto Sans KR"';
            ctx.fillStyle = '#A5B4FC';
            ctx.textAlign = 'center';
            ctx.fillText(result.mbtiType, width / 2, currentY + 21);

            currentY += 50;

            ctx.font = 'bold 20px "Noto Sans KR"';
            ctx.fillStyle = '#F8FAFC';
            ctx.textAlign = 'center';
            ctx.fillText(`"${profile.title}"`, width / 2, currentY);

            currentY += 26;

            ctx.font = '500 13px "Noto Sans KR"';
            ctx.fillStyle = '#94A3B8';
            ctx.fillText(profile.tagline, width / 2, currentY);

            currentY += 25;

            const badgeY = currentY;
            let totalBadgeW = profile.badge.reduce((acc, b) => acc + (b.length * 12 + 20), 0);
            let startBadgeX = width / 2 - totalBadgeW / 2;

            profile.badge.forEach(b => {
                const bw = b.length * 12 + 16;
                drawRoundedRect(ctx, startBadgeX, badgeY, bw, 24, 8, 'rgba(51, 65, 85, 0.6)', 'rgba(148, 163, 184, 0.3)', 1);
                ctx.font = '11px "Noto Sans KR"';
                ctx.fillStyle = '#CBD5E1';
                ctx.textAlign = 'center';
                ctx.fillText(`#${b}`, startBadgeX + bw / 2, badgeY + 16);
                startBadgeX += bw + 8;
            });

            currentY += 45;

            const descW = cardW - 30;
            const descX = cardX + 15;
            const descH = drawTextWithWrap(ctx, profile.desc, descX + 15, currentY + 20, descW - 30, 22, '400 13px "Noto Sans KR"', '#E2E8F0', 'left');
            drawRoundedRect(ctx, descX, currentY, descW, descH + 25, 16, 'rgba(15, 23, 42, 0.5)', 'rgba(51, 65, 85, 0.4)', 1);

            currentY += descH + 45;

            ctx.font = 'bold 15px "Noto Sans KR"';
            ctx.fillStyle = '#F8FAFC';
            ctx.textAlign = 'left';
            ctx.fillText('📖 나의 대표 학습 강점 3가지', cardX + 15, currentY);

            currentY += 15;

            profile.strengths.forEach((str) => {
                const sH = drawTextWithWrap(ctx, `✓  ${str}`, cardX + 30, currentY + 22, cardW - 60, 20, '500 13px "Noto Sans KR"', '#6EE7B7', 'left');
                drawRoundedRect(ctx, cardX + 15, currentY, cardW - 30, sH + 15, 12, 'rgba(6, 78, 59, 0.25)', 'rgba(16, 185, 129, 0.3)', 1);
                currentY += sH + 25;
            });

            currentY += 10;

            ctx.font = 'bold 15px "Noto Sans KR"';
            ctx.fillStyle = '#F8FAFC';
            ctx.textAlign = 'left';
            ctx.fillText('💡 나만의 맞춤 추천 공부법', cardX + 15, currentY);

            currentY += 15;

            profile.studyMethods.forEach((method, idx) => {
                const titleH = 20;
                const bodyH = drawTextWithWrap(ctx, method.desc, cardX + 30, currentY + 38, cardW - 60, 20, '400 12px "Noto Sans KR"', '#94A3B8', 'left');

                drawRoundedRect(ctx, cardX + 15, currentY, cardW - 30, titleH + bodyH + 28, 14, 'rgba(30, 41, 59, 0.7)', 'rgba(99, 102, 241, 0.25)', 1);

                ctx.font = 'bold 13px "Noto Sans KR"';
                ctx.fillStyle = '#818CF8';
                ctx.textAlign = 'left';
                ctx.fillText(`${idx + 1}. ${method.title}`, cardX + 30, currentY + 22);

                currentY += titleH + bodyH + 38;
            });

            currentY += 10;

            ctx.font = 'bold 15px "Noto Sans KR"';
            ctx.fillStyle = '#F8FAFC';
            ctx.textAlign = 'left';
            ctx.fillText('⚡ 학습 관리 & 최적 환경', cardX + 15, currentY);

            currentY += 15;

            const slumpH = drawTextWithWrap(ctx, profile.slumpTips, cardX + 30, currentY + 35, cardW - 60, 20, '400 12px "Noto Sans KR"', '#FCA5A5', 'left');
            drawRoundedRect(ctx, cardX + 15, currentY, cardW - 30, slumpH + 25, 14, 'rgba(136, 19, 55, 0.25)', 'rgba(244, 63, 94, 0.3)', 1);
            ctx.font = 'bold 12px "Noto Sans KR"';
            ctx.fillStyle = '#F43F5E';
            ctx.fillText('⚠️ 슬럼프 극복 팁', cardX + 30, currentY + 20);

            currentY += slumpH + 35;

            const envH = drawTextWithWrap(ctx, profile.env, cardX + 30, currentY + 35, cardW - 60, 20, '400 12px "Noto Sans KR"', '#A5B4FC', 'left');
            drawRoundedRect(ctx, cardX + 15, currentY, cardW - 30, envH + 25, 14, 'rgba(49, 46, 129, 0.25)', 'rgba(99, 102, 241, 0.3)', 1);
            ctx.font = 'bold 12px "Noto Sans KR"';
            ctx.fillStyle = '#818CF8';
            ctx.fillText('🏞️ 최적 공부 장소', cardX + 30, currentY + 20);

            currentY += envH + 45;

            ctx.font = 'bold 15px "Noto Sans KR"';
            ctx.fillStyle = '#F8FAFC';
            ctx.textAlign = 'left';
            ctx.fillText('📊 세부 성향 비율 그래프', cardX + 15, currentY);

            currentY += 20;

            const graphW = cardW - 30;
            const graphX = cardX + 15;

            const graphData = [
                { left: '외향형(E)', right: '내향형(I)', lVal: result.ratios.ePct, rVal: result.ratios.iPct, color: '#6366F1' },
                { left: '감각형(S)', right: '직관형(N)', lVal: result.ratios.sPct, rVal: result.ratios.nPct, color: '#10B981' },
                { left: '사고형(T)', right: '감정형(F)', lVal: result.ratios.tPct, rVal: result.ratios.fPct, color: '#3B82F6' },
                { left: '판단형(J)', right: '인식형(P)', lVal: result.ratios.jPct, rVal: result.ratios.pPct, color: '#F59E0B' }
            ];

            graphData.forEach(g => {
                ctx.font = '12px "Noto Sans KR"';
                ctx.fillStyle = '#CBD5E1';
                ctx.textAlign = 'left';
                ctx.fillText(`${g.left} ${g.lVal}%`, graphX, currentY);

                ctx.textAlign = 'right';
                ctx.fillText(`${g.right} ${g.rVal}%`, graphX + graphW, currentY);

                currentY += 8;

                drawRoundedRect(ctx, graphX, currentY, graphW, 10, 5, '#334155');
                const fillW = (graphW * g.lVal) / 100;
                drawRoundedRect(ctx, graphX, currentY, fillW, 10, 5, g.color);

                currentY += 26;
            });

            currentY += 10;

            const btnW = (cardW - 40) / 2;
            const btn1_X = cardX + 15;
            const btn2_X = btn1_X + btnW + 10;

            const isHoverReset = hoverId === 'btn_reset';
            drawRoundedRect(ctx, btn1_X, currentY, btnW, 48, 12, isHoverReset ? '#475569' : '#334155', '#64748B', 1);
            ctx.font = 'bold 13px "Noto Sans KR"';
            ctx.fillStyle = '#F8FAFC';
            ctx.textAlign = 'center';
            ctx.fillText('🔄 다시 테스트', btn1_X + btnW / 2, currentY + 28);

            clickTargets.push({
                id: 'btn_reset',
                x: btn1_X,
                y: currentY,
                w: btnW,
                h: 48,
                onClick: () => {
                    state = 'INTRO';
                }
            });

            const isHoverShare = hoverId === 'btn_share';
            drawRoundedRect(ctx, btn2_X, currentY, btnW, 48, 12, isHoverShare ? '#4F46E5' : '#6366F1', '#818CF8', 1);
            ctx.font = 'bold 13px "Noto Sans KR"';
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.fillText('📋 결과 링크 복사', btn2_X + btnW / 2, currentY + 28);

            clickTargets.push({
                id: 'btn_share',
                x: btn2_X,
                y: currentY,
                w: btnW,
                h: 48,
                onClick: () => {
                    try {
                        const tempInput = document.createElement('input');
                        tempInput.value = window.location.href;
                        document.body.appendChild(tempInput);
                        tempInput.select();
                        document.execCommand('copy');
                        document.body.removeChild(tempInput);
                        showToast('결과 페이지 링크가 복사되었습니다! 🎉');
                    } catch (e) {
                        showToast('링크 복사 완료!');
                    }
                }
            });

            currentY += 80;

            drawRoundedRect(ctx, cardX, startCardY - 20, cardW, currentY - startCardY + 20, 24, 'rgba(30, 41, 59, 0.4)', 'rgba(99, 102, 241, 0.2)', 1);

            maxScrollY = Math.max(0, currentY - height + 100);

            ctx.restore();
        }

        function renderToast() {
            if (!toastMessage) return;

            const toastW = Math.min(width - 40, 320);
            const toastX = width / 2 - toastW / 2;
            const toastY = 30;

            drawRoundedRect(ctx, toastX, toastY, toastW, 42, 21, 'rgba(15, 23, 42, 0.95)', '#818CF8', 1.5);
            ctx.font = 'bold 12px "Noto Sans KR"';
            ctx.fillStyle = '#F8FAFC';
            ctx.textAlign = 'center';
            ctx.fillText(toastMessage, width / 2, toastY + 26);
        }

        function render() {
            ctx.clearRect(0, 0, width, height);

            renderBackground();

            if (state === 'INTRO') renderIntroScreen();
            else if (state === 'QUIZ') renderQuizScreen();
            else if (state === 'ANALYZING') renderAnalyzingScreen();
            else if (state === 'RESULT') renderResultScreen();

            renderToast();

            requestAnimationFrame(render);
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvas.addEventListener('mousemove', (e) => {
            const pos = getCanvasCoords(e);
            let foundHover = null;

            const effectiveY = state === 'RESULT' ? pos.y + scrollY : pos.y;

            clickTargets.forEach(target => {
                if (pos.x >= target.x && pos.x <= target.x + target.w &&
                    effectiveY >= target.y && effectiveY <= target.y + target.h) {
                    foundHover = target.id;
                }
            });

            hoverId = foundHover;
            canvas.style.cursor = foundHover ? 'pointer' : 'default';
        });

        canvas.addEventListener('mousedown', (e) => {
            const pos = getCanvasCoords(e);
            if (state === 'RESULT') {
                isDragging = true;
                startY = pos.y;
                dragScrollStart = targetScrollY;
            }

            const effectiveY = state === 'RESULT' ? pos.y + scrollY : pos.y;

            clickTargets.forEach(target => {
                if (pos.x >= target.x && pos.x <= target.x + target.w &&
                    effectiveY >= target.y && effectiveY <= target.y + target.h) {
                    target.onClick();
                }
            });
        });

        canvas.addEventListener('touchstart', (e) => {
            const pos = getCanvasCoords(e);
            if (state === 'RESULT') {
                isDragging = true;
                startY = pos.y;
                dragScrollStart = targetScrollY;
            }

            const effectiveY = state === 'RESULT' ? pos.y + scrollY : pos.y;

            clickTargets.forEach(target => {
                if (pos.x >= target.x && pos.x <= target.x + target.w &&
                    effectiveY >= target.y && effectiveY <= target.y + target.h) {
                    target.onClick();
                }
            });
        });

        canvas.addEventListener('touchmove', (e) => {
            if (state === 'RESULT' && isDragging) {
                const pos = getCanvasCoords(e);
                const deltaY = startY - pos.y;
                targetScrollY = Math.max(0, Math.min(maxScrollY, dragScrollStart + deltaY));
                e.preventDefault();
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
            if (state === 'RESULT') {
                targetScrollY = Math.max(0, Math.min(maxScrollY, targetScrollY + e.deltaY));
                e.preventDefault();
            }
        }, { passive: false });

        window.onload = function () {
            render();
        };
    </script>
</body>
</html>
